services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.multi
    image: ${IMAGE_REPOSITORY:-ghcr.io/local/demo-api}/api:${IMAGE_TAG:-dev}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PORT: 3000
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-demo}
      PGDATABASE: ${POSTGRES_DB:-demo}
      PGPASSWORD_FILE: /run/secrets/db_password
      NOTIFIER_PORT: "4000"
    ports:
      - "${API_PORT:-8080}:3000"
    secrets:
      - db_password
    networks:
      - front
      - back

  notifier:
    build: ./notifier
    image: ${IMAGE_REPOSITORY:-ghcr.io/local/demo-api}/notifier:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      PORT: "4000"
    networks:
      - back

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_DB: ${POSTGRES_DB:-demo}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    secrets:
      - db_password
    networks:
      - back
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    networks:
      - back

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt

networks:
  front:
  back:
